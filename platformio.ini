[env:cardputer-wheel]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino

; Same libs as the TamaFi port. M5Unified pulls in M5GFX; M5Cardputer gives
; us the built-in keyboard/speaker helpers.
lib_deps =
    m5stack/M5Unified
    m5stack/M5Cardputer

; No custom partitions.csv needed here (no OTA, no big animation blobs like
; TamaFi had) - PlatformIO's built-in huge_app scheme gives plenty of room
; for M5GFX + a small app.
board_build.partitions = huge_app.csv

monitor_speed = 115200

build_flags =
    -DCORE_DEBUG_LEVEL=0
